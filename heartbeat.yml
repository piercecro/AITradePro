name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch:

jobs:
  ping-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function heartbeat
        env:
          HEARTBEAT_URL: https://oelvervujxepvxnimtqt.functions.supabase.co/heartbeat
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$HEARTBEAT_URL")
          echo "Heartbeat status: $status"
          if [ "$status" != "200" ]; then
            echo "Heartbeat failed with status $status" >&2
            exit 1
          fi
