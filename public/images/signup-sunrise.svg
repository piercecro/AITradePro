<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Start your autotrading journey</title>
  <desc id="desc">A warm sunrise over layered mountains and green hills.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a9b9f4"/>
      <stop offset=".3" stop-color="#f3a5b1"/>
      <stop offset=".58" stop-color="#ffd47b"/>
      <stop offset="1" stop-color="#f68d48"/>
    </linearGradient>
    <radialGradient id="sunGlow"><stop stop-color="#fffbd7" stop-opacity=".95"/><stop offset=".3" stop-color="#ffe38e" stop-opacity=".55"/><stop offset="1" stop-color="#ffe38e" stop-opacity="0"/></radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9e91a4"/><stop offset="1" stop-color="#647282"/></linearGradient>
    <linearGradient id="middleHill" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#58706a"/><stop offset="1" stop-color="#263d38"/></linearGradient>
    <linearGradient id="frontHill" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#586447"/><stop offset="1" stop-color="#182c22"/></linearGradient>
